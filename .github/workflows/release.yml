# Le dépôt GitHub est un miroir de Gitea : chaque tag poussé devient une Release,
# que HACS lit pour afficher la version et proposer les mises à jour.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Créer la Release depuis le message du tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" > notes.txt
          gh release create "$TAG" --title "$TAG" --notes-file notes.txt --verify-tag
