# Carte de tableau de bord Betaloop.
# Prérequis : les cartes "apexcharts-card" et "config-template-card" (HACS > Interface).
# Utilisation : Tableau de bord > Modifier > Ajouter une carte > Manuel, puis coller ce YAML.
#
# Le graphique lit directement les séries exposées en attributs par l'intégration
# (readings / doses / meals) : il affiche donc tout l'historique de la fenêtre configurée
# dès l'installation, sans attendre que le recorder de Home Assistant se remplisse.
#
# config-template-card injecte dans le graphique les seuils réglés dans l'app (attributs
# target_low / target_high de sensor.betaloop_glucose, transmis par le serveur 1.7) :
# apexcharts-card seule n'accepte que des valeurs fixes pour la bande cible et les couleurs.
type: vertical-stack
cards:
  - type: custom:config-template-card
    # Seuils de l'app ; 70 et 180 mg/dL (ceux par défaut) si le capteur est indisponible ou si
    # le serveur est antérieur à la 1.7.
    variables:
      LOW: states['sensor.betaloop_glucose']?.attributes?.target_low ?? 70
      HIGH: states['sensor.betaloop_glucose']?.attributes?.target_high ?? 180
    entities:
      - sensor.betaloop_glucose
    card:
      type: custom:apexcharts-card
      graph_span: 24h
      experimental:
        color_threshold: true
      header:
        show: true
        title: Glycémie
        show_states: true
        colorize_states: true
      now:
        show: true
      all_series_config:
        show:
          legend_value: false
      yaxis:
        - id: glucose
          min: 40
          max: ~300
          decimals: 0
          apex_config:
            tickAmount: 6
        - id: bolus
          opposite: true
          min: 0
          max: ~20
          decimals: 0
          show: false
        - id: carbs
          opposite: true
          min: 0
          max: ~150
          decimals: 0
          show: false
      apex_config:
        chart:
          height: 320
        # Affiché quand aucune série n'a de point, en général parce que les capteurs sont
        # indisponibles (serveur injoignable). Par défaut ApexCharts affiche "Loading...", ce qui
        # laisse croire à un chargement en cours.
        noData:
          text: Aucune donnée — capteurs Betaloop indisponibles ?
        annotations:
          yaxis:
            # Plage cible : seuils de l'app (variables LOW / HIGH plus haut).
            - y: ${LOW}
              y2: ${HIGH}
              fillColor: "#4caf50"
              opacity: 0.08
              borderColor: transparent
            - y: ${LOW}
              borderColor: "#e53935"
              strokeDashArray: 4
            - y: ${HIGH}
              borderColor: "#fb8c00"
              strokeDashArray: 4
      series:
        - entity: sensor.betaloop_glucose
          name: Glycémie
          yaxis_id: glucose
          type: line
          stroke_width: 2.5
          extend_to: false
          color_threshold:
            - value: 0
              color: "#e53935"
            - value: ${LOW}
              color: "#43a047"
            - value: ${HIGH}
              color: "#fb8c00"
            - value: 250
              color: "#e53935"
          data_generator: |
            return entity.attributes.readings || [];
        - entity: sensor.betaloop_insulin
          name: Insuline
          yaxis_id: bolus
          type: column
          color: "#1e88e5"
          unit: U
          show:
            in_header: false
          data_generator: |
            return (entity.attributes.doses || []).map(d => [d.t, d.units]);
        - entity: sensor.betaloop_carbs
          name: Glucides
          yaxis_id: carbs
          type: column
          color: "#8e24aa"
          unit: g
          show:
            in_header: false
          data_generator: |
            return (entity.attributes.meals || [])
              .filter(m => m.carbs !== null)
              .map(m => [m.t, m.carbs]);

  - type: glance
    columns: 4
    entities:
      - entity: sensor.betaloop_trend
        name: Tendance
      - entity: sensor.betaloop_glucose_delta
        name: Variation
      - entity: sensor.betaloop_time_in_range_24h
        name: Dans la cible
      - entity: sensor.betaloop_average_24h
        name: Moyenne 24 h
      - entity: sensor.betaloop_estimated_hba1c
        name: GMI
      - entity: sensor.betaloop_insulin
        name: Insuline 24 h
      - entity: sensor.betaloop_carbs
        name: Glucides 24 h
      - entity: sensor.betaloop_steps_today
        name: Pas
      - entity: sensor.betaloop_last_reading
        name: Relevé
        format: relative
      - entity: sensor.betaloop_sensor_expiry
        name: Capteur
        format: relative
